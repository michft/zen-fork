name: michft TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed VERSION to upload for internal TestFlight testing
        required: true
        type: string
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'michft/zen-fork'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || 'PP97C35JA7' }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'net.mich431.ffoxfork.dev' }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate main, committed version, and Apple build number
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Dispatch TestFlight uploads from main only.')
          version = os.environ['INPUT_VERSION']
          if not re.fullmatch(r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', version):
              raise SystemExit('Expected MAJOR.MINOR.PATCH without leading zeroes.')
          if version != pathlib.Path('VERSION').read_text().strip():
              raise SystemExit('TestFlight version must match committed VERSION.')
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          if not (1 <= run <= 9999 and 1 <= attempt <= 99):
              raise SystemExit('TestFlight build number exceeds Apple component limits.')
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['ASC_APP_ID']):
              raise SystemExit('Configure numeric ASC_APP_ID in ios-testflight.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TESTFLIGHT_VERSION={version}\nTESTFLIGHT_BUILD_NUMBER={run}.{attempt}\n')
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.22.0'
      - name: Prepare pinned build tools and validate scripts
        run: |
          set -euo pipefail
          xcodebuild -version
          pnpm install --frozen-lockfile
          python3 - <<'PY'
          import json, os, pathlib, re
          manifest = json.loads(pathlib.Path('ci/dependencies.json').read_text())
          fields = {'release': r'build-deps-\d{4}-\d{2}-\d{2}', 'asset': r'ffox-ci-dependencies-\d{8}\.tar\.gz', 'sha256': r'[a-f0-9]{64}'}
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key, pattern in fields.items():
                  value = manifest.get(key, '')
                  if not isinstance(value, str) or not re.fullmatch(pattern, value):
                      raise SystemExit(f'Invalid dependency {key}.')
                  env.write(f'CI_DEPENDENCY_{key.upper()}={value}\n')
          PY
      - name: Restore michft-hosted dependency snapshot
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/$CI_DEPENDENCY_ASSET"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "https://github.com/michft/zen-fork/releases/download/$CI_DEPENDENCY_RELEASE/$CI_DEPENDENCY_ASSET" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$CI_DEPENDENCY_SHA256" "$ARCHIVE" | shasum -a 256 --check
          python3 scripts/prepare-ci-dependencies.py --archive "$ARCHIVE"
          cp scripts/nimbus-fml-offline.sh firefox-ios/bin/nimbus-fml.sh
      - name: Test project preparation and release validation
        run: |
          python3 -m unittest discover -s scripts -p 'test_deploy_device.py'
          python3 -m unittest discover -s scripts -p 'test_prepare_personal_device.py'
          python3 -m unittest discover -s scripts -p 'test_release_ios.py'
          python3 -m unittest discover -s scripts -p 'test_prepare_ci_dependencies.py'
      - name: Import TestFlight distribution identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.TESTFLIGHT_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.TESTFLIGHT_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.TESTFLIGHT_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$PROFILE_BASE64" ]] || { echo 'Configure ios-testflight distribution secrets first.' >&2; exit 1; }
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/testflight-signing"
          mkdir -p "$SIGNING_DIR"
          python3 - <<'PY'
          import base64, os, pathlib, secrets, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'testflight-signing'
          (root / 'certificate.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE_BASE64'], validate=True))
          (root / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['PROFILE_BASE64'], validate=True))
          (root / 'keychain-password').write_text(secrets.token_hex(32))
          (root / 'previous-keychains').write_text(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          PY
          KEYCHAIN="$SIGNING_DIR/testflight.keychain-db"
          KEYCHAIN_PASSWORD="$(cat "$SIGNING_DIR/keychain-password")"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGNING_DIR/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          python3 - <<'PY'
          import os, pathlib, plistlib, re, shlex, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'testflight-signing'
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', str(root / 'testflight.keychain-db'), *shlex.split((root / 'previous-keychains').read_text())], check=True)
          identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning', str(root / 'testflight.keychain-db')], text=True)
          matches = re.findall(r'\b[0-9A-F]{40}\b', identities)
          if len(matches) != 1:
              raise SystemExit('P12 must contain exactly one valid signing identity.')
          profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(root / 'profile.mobileprovision')]))
          uuid = profile.get('UUID', '')
          if not re.fullmatch(r'[A-Fa-f0-9-]{36}', uuid):
              raise SystemExit('Invalid provisioning profile UUID.')
          paths = []
          for parent in ['Library/Developer/Xcode/UserData/Provisioning Profiles', 'Library/MobileDevice/Provisioning Profiles']:
              target = pathlib.Path.home() / parent / f'{uuid}.mobileprovision'
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  raise SystemExit('Provisioning profile already exists; refusing to overwrite.')
              paths.append(str(target))
              (root / 'installed-profiles').write_text('\n'.join(paths))
              shutil.copyfile(root / 'profile.mobileprovision', target)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"SIGNING_IDENTITY={matches[0]}\nPROFILE_PATH={root / 'profile.mobileprovision'}\n")
          PY

      - name: Archive and verify App Store Connect universal IPA
        run: |
          python3 scripts/release-ios.py \
            --version "$TESTFLIGHT_VERSION" --build-number "$TESTFLIGHT_BUILD_NUMBER" \
            --team "$IOS_TEAM_ID" --bundle-id "$IOS_BUNDLE_ID" \
            --profile "$PROFILE_PATH" --identity "$SIGNING_IDENTITY" \
            --method app-store-connect --output .build/testflight
      - name: Validate and upload to App Store Connect
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/testflight-signing/private_keys
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib, re
          key_id = os.environ['ASC_KEY_ID']
          issuer = os.environ['ASC_ISSUER_ID']
          if not re.fullmatch(r'[A-Z0-9]{10}', key_id):
              raise SystemExit('Configure a valid App Store Connect team key ID.')
          if not re.fullmatch(r'[A-Fa-f0-9]{8}(?:-[A-Fa-f0-9]{4}){3}-[A-Fa-f0-9]{12}', issuer):
              raise SystemExit('Configure the App Store Connect team issuer UUID.')
          root = pathlib.Path(os.environ['API_PRIVATE_KEYS_DIR'])
          root.mkdir(parents=True, exist_ok=True)
          key = base64.b64decode(os.environ['ASC_PRIVATE_KEY_P8_BASE64'], validate=True)
          (root / f'AuthKey_{key_id}.p8').write_bytes(key)
          PY
          openssl pkey -in "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8" -noout
          IPA_FILES=(.build/testflight/*.ipa)
          [[ ${#IPA_FILES[@]} == 1 && -f "${IPA_FILES[0]}" ]] || { echo 'Expected exactly one verified IPA.' >&2; exit 1; }
          AUTH=(--api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID")
          APP=(--platform ios --apple-id "$ASC_APP_ID" --bundle-id "$IOS_BUNDLE_ID" \
            --bundle-version "$TESTFLIGHT_BUILD_NUMBER" --bundle-short-version-string "$TESTFLIGHT_VERSION")
          xcrun altool --validate-app "${IPA_FILES[0]}" "${APP[@]}" "${AUTH[@]}"
          xcrun altool --upload-app -f "${IPA_FILES[0]}" "${APP[@]}" "${AUTH[@]}"
          printf '### TestFlight upload accepted\n\nVersion: %s (%s). Apple processing and tester distribution remain separate.\n' \
            "$TESTFLIGHT_VERSION" "$TESTFLIGHT_BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove TestFlight signing material and private export
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shlex, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'testflight-signing'
          previous = root / 'previous-keychains'
          failures = []
          if previous.exists():
              result = subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(previous.read_text())])
              if result.returncode:
                  failures.append('restoring keychain search list')
          installed = root / 'installed-profiles'
          if installed.exists():
              for path in installed.read_text().splitlines():
                  try:
                      pathlib.Path(path).unlink(missing_ok=True)
                  except OSError:
                      failures.append('removing installed provisioning profile')
          keychain = root / 'testflight.keychain-db'
          if keychain.exists():
              result = subprocess.run(['security', 'delete-keychain', str(keychain)])
              if result.returncode:
                  failures.append('deleting temporary keychain')
          for path, description in [(root, 'removing signing credentials'),
                                    (pathlib.Path('.build/testflight'), 'removing private export')]:
              try:
                  shutil.rmtree(path)
              except FileNotFoundError:
                  pass
              except OSError:
                  failures.append(description)
          if failures:
              raise SystemExit('Signing cleanup failed: ' + ', '.join(failures))
          PY
