name: michft iOS and iPadOS release

on:
  push:
    tags: ['ffox-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Fork VERSION to sign, tag, and release from main
        required: true
        type: string
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.event.inputs.version && format('ffox-v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'michft/zen-fork'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: ios-release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || 'PP97C35JA7' }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'net.mich431.ffoxfork.dev' }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'debugging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fork version and trusted release commit
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Dispatch releases from main only.' >&2; exit 1; }
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#ffox-v}"
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected MAJOR.MINOR.PATCH.' >&2; exit 1; }
          [[ "$VERSION" == "$(cat VERSION)" ]] || { echo 'Release version must match committed VERSION.' >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Release commit must belong to main.' >&2; exit 1; }
          TAG="ffox-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git rev-parse "$TAG^{commit}")" == "$GITHUB_SHA" ]] || { echo 'Existing release tag points elsewhere.' >&2; exit 1; }
          fi
          printf 'RELEASE_VERSION=%s\nRELEASE_TAG=%s\n' "$VERSION" "$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.22.0'
      - name: Prepare pinned build tools and validate scripts
        run: |
          set -euo pipefail
          xcodebuild -version
          pnpm install --frozen-lockfile
          python3 - <<'PY'
          import json, os, pathlib, re
          manifest = json.loads(pathlib.Path('ci/dependencies.json').read_text())
          fields = {'release': r'build-deps-\d{4}-\d{2}-\d{2}', 'asset': r'ffox-ci-dependencies-\d{8}\.tar\.gz', 'sha256': r'[a-f0-9]{64}'}
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key, pattern in fields.items():
                  value = manifest.get(key, '')
                  if not isinstance(value, str) or not re.fullmatch(pattern, value):
                      raise SystemExit(f'Invalid dependency {key}.')
                  env.write(f'CI_DEPENDENCY_{key.upper()}={value}\n')
          PY
      - name: Restore michft-hosted dependency snapshot
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/$CI_DEPENDENCY_ASSET"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "https://github.com/michft/zen-fork/releases/download/$CI_DEPENDENCY_RELEASE/$CI_DEPENDENCY_ASSET" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$CI_DEPENDENCY_SHA256" "$ARCHIVE" | shasum -a 256 --check
          python3 scripts/prepare-ci-dependencies.py --archive "$ARCHIVE"
          cp scripts/nimbus-fml-offline.sh firefox-ios/bin/nimbus-fml.sh
      - name: Test project preparation and release validation
        run: |
          python3 -m unittest discover -s scripts -p 'test_deploy_device.py'
          python3 -m unittest discover -s scripts -p 'test_prepare_personal_device.py'
          python3 -m unittest discover -s scripts -p 'test_release_ios.py'
          python3 -m unittest discover -s scripts -p 'test_prepare_ci_dependencies.py'
      - name: Import release signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$PROFILE_BASE64" ]] || { echo 'Configure ios-release signing secrets first.' >&2; exit 1; }
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/ios-signing"
          mkdir -p "$SIGNING_DIR"
          python3 - <<'PY'
          import base64, os, pathlib, secrets, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ios-signing'
          (root / 'certificate.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE_BASE64'], validate=True))
          (root / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['PROFILE_BASE64'], validate=True))
          (root / 'keychain-password').write_text(secrets.token_hex(32))
          (root / 'previous-keychains').write_text(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          PY
          KEYCHAIN="$SIGNING_DIR/release.keychain-db"
          KEYCHAIN_PASSWORD="$(cat "$SIGNING_DIR/keychain-password")"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGNING_DIR/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          python3 - <<'PY'
          import os, pathlib, plistlib, re, shlex, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ios-signing'
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', str(root / 'release.keychain-db'), *shlex.split((root / 'previous-keychains').read_text())], check=True)
          identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning', str(root / 'release.keychain-db')], text=True)
          matches = re.findall(r'\b[0-9A-F]{40}\b', identities)
          if len(matches) != 1:
              raise SystemExit('P12 must contain exactly one valid signing identity.')
          profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(root / 'profile.mobileprovision')]))
          uuid = profile.get('UUID', '')
          if not re.fullmatch(r'[A-Fa-f0-9-]{36}', uuid):
              raise SystemExit('Invalid provisioning profile UUID.')
          paths = []
          for parent in ['Library/Developer/Xcode/UserData/Provisioning Profiles', 'Library/MobileDevice/Provisioning Profiles']:
              target = pathlib.Path.home() / parent / f'{uuid}.mobileprovision'
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  raise SystemExit('Provisioning profile already exists; refusing to overwrite.')
              paths.append(str(target))
              (root / 'installed-profiles').write_text('\n'.join(paths))
              shutil.copyfile(root / 'profile.mobileprovision', target)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"SIGNING_IDENTITY={matches[0]}\nPROFILE_PATH={root / 'profile.mobileprovision'}\n")
          PY
      - name: Archive and verify signed universal IPA
        run: |
          python3 scripts/release-ios.py \
            --version "$RELEASE_VERSION" --build-number "$GITHUB_RUN_NUMBER" \
            --team "$IOS_TEAM_ID" --bundle-id "$IOS_BUNDLE_ID" \
            --profile "$PROFILE_PATH" --identity "$SIGNING_IDENTITY" \
            --method "$IOS_EXPORT_METHOD" --output .build/release
      - name: Remove signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shlex, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ios-signing'
          previous = root / 'previous-keychains'
          failures = []
          if previous.exists():
              result = subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(previous.read_text())])
              if result.returncode:
                  failures.append('restoring keychain search list')
          installed = root / 'installed-profiles'
          if installed.exists():
              for path in installed.read_text().splitlines():
                  pathlib.Path(path).unlink(missing_ok=True)
          keychain = root / 'release.keychain-db'
          if keychain.exists():
              result = subprocess.run(['security', 'delete-keychain', str(keychain)])
              if result.returncode:
                  failures.append('deleting temporary keychain')
          shutil.rmtree(root, ignore_errors=True)
          if failures:
              raise SystemExit('Signing cleanup failed: ' + ', '.join(failures))
          PY
      - name: Tag verified commit and publish universal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Universal Release build for iOS and iPadOS. Verify downloads using SHA256SUMS.

          Apple provisioning restrictions still apply: a development or ad hoc IPA runs only on registered devices included in its provisioning profile. The IPA embeds that Apple profile and its registered device identifiers. Public download does not mean unrestricted installation.

          Source, signing expiry, and build details are in build-info.json. This release does not submit anything to App Store Connect.
          NOTES
          gh release create "$RELEASE_TAG" .build/release/*.ipa \
            .build/release/SHA256SUMS .build/release/build-info.json \
            --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "ffox $RELEASE_VERSION · iOS + iPadOS" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
